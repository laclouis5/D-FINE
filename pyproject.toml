[project]
name = "d-fine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Louis Lac", email = "louis.lac@neovision.fr" }
]
requires-python = ">=3.10"
dependencies = [
    "calflops>=0.3.2",
    "faster-coco-eval>=1.6.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "numpy>=1.16.0",
    "pillow>=11.2.1",
    "pyyaml>=6.0.2",
    "scipy>=1.15.2",
    "tensorboard>=2.19.0",
    "timm>=1.0.15",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.51.3",
    "wandb>=0.19.9",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.17.0",
    "onnx-graphsurgeon>=0.5.8",
    "onnxruntime>=1.21.0",
    "onnxsim>=0.4.36",
    "onnxslim>=0.1.50",
    "opencv-python>=4.11.0.86",
]
benchmark = [
    "calflops>=0.3.2",
    "onnxruntime>=1.21.0",
]
viz = [
    "fiftyone>=1.4.1",
]
openvino = [
    "openvino>=2025.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
